[project]
name = "redteam-audit"
version = "0.1.0"
description = "Red-team and guardrail audit of a RAG support chatbot: 59 attacks incl. indirect prompt injection, canary-based leak detection, LLM judge, three defense configurations and controls."
authors = [
    { name = "Md Masud Rana", email = "34313493+masudr4n4@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "openai>=3.46.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
